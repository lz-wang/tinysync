name: Protocol Integration

# 可复用的协议 integration gate：真实服务容器（S3 job 用 Silo 容器
# （MinIO fork），SMB job 用 Samba 容器，HTTP job 用 nginx / Caddy /
# miniserve 容器），验证各协议 adapter 与同一 Sync Engine 的真实
# 端到端行为。Build 与 Release workflow 共用本 workflow，避免维护
# 两份装配；远端发布门禁因此与 main 的持续集成使用同一套
# integration 证据。SFTP / WebDAV 的真实协议栈测试由 in-process
# server 覆盖、随 make check 运行，不在本 gate 内。
#
# ref 为必填输入：可复用 workflow 的 github context 始终跟随调用方
# 事件，checkout 不显式指定 ref 时会检出触发调用方的 commit。Build
# 传入 github.sha，Release 传入发布 tag，保证"被验证的 commit ==
# 被发布的 commit"。
#
# S3 与 SMB 拆成独立 job：Samba image / network 故障不会被误认为
# S3 regression（反之亦然）。
#
# 服务以 step 容器启动而不是 service container：service container
# 拉取失败无法重试，会让 gate 在未运行任何测试的情况下变红；step
# 方式允许 pull 重试。MinIO 社区版已停止分发容器镜像（仓库 2026-02
# 归档、Docker Hub 仓库 2026-04 删除、quay.io/minio/minio 自
# 2026-09-24 起整仓拒绝匿名拉取），改用 PGSTY 维护的 MinIO fork
# pgsty/silo（AGPLv3，drop-in 兼容：server 子命令、MINIO_ROOT_*
# 环境变量与 /minio/health/live 端点均沿用）。
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA or tag to checkout and test"
        required: true
        type: string

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  s3:
    name: S3 integration (Silo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # pull 重试以吸收瞬时限流；pgsty/silo:latest 为活维护的滚动 tag
      #（上游已无固定 RELEASE tag 可锚定）。
      - name: Start S3 service (Silo)
        run: |
          image="docker.io/pgsty/silo:latest"
          pulled=false
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              pulled=true
              break
            fi
            echo "pull attempt ${attempt} failed, retrying..."
            sleep $((attempt * 10))
          done
          if [ "${pulled}" != "true" ]; then
            echo "Failed to pull ${image} after retries"
            exit 1
          fi
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=tinysync \
            -e MINIO_ROOT_PASSWORD=tinysync-secret \
            --health-cmd "curl -f http://localhost:9000/minio/health/live" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            "$image" server /data

      - name: Wait for S3 service healthy
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' minio)"
            echo "s3 service health: ${health}"
            if [ "${health}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Run S3 integration tests
        env:
          TINYSYNC_IT_S3_ENDPOINT: http://localhost:9000
          TINYSYNC_IT_S3_REGION: us-east-1
          TINYSYNC_IT_S3_ACCESS_KEY: tinysync
          TINYSYNC_IT_S3_SECRET_KEY: tinysync-secret
        run: make integration

      - name: Stop S3 service
        if: always()
        run: docker rm -f minio

  smb:
    name: SMB integration (Samba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # 真实 Samba（smbd-only variant）：真实 TCP + SMB2/3 negotiate +
      # NTLMv2 + 真实文件系统。pull 重试语义与 S3 job 相同。镜像按
      # digest 固定（smbd-only-latest 是滚动 tag：镜像升级可能改变
      # 默认 smb.conf / 权限模型 / 协议最低版本，integration gate 会
      # 在无代码变更的情况下变红）；当前 digest 对应 Samba 4.23.8。
      - name: Start Samba service
        run: |
          image="ghcr.io/servercontainers/samba@sha256:31b90ea7fe3258d30fccd971c85743b92694605f4b43dc8a4df23a202fced06a"
          pulled=false
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              pulled=true
              break
            fi
            echo "pull attempt ${attempt} failed, retrying..."
            sleep $((attempt * 10))
          done
          if [ "${pulled}" != "true" ]; then
            echo "Failed to pull ${image} after retries"
            exit 1
          fi
          # 宿主机目录 0777：容器内 Samba 进程与 runner 用户 UID 不同，
          # 0755 会让 SMB 写入（mkdir 造隔离目录等）在 Linux 文件系统
          # 层被拒（permission denied）。这是 CI 专属的一次性测试
          # 目录，不与仓库 / 常驻数据混用。
          install -d -m 0777 /tmp/tinysync-smb-it
          docker run -d --name samba \
            -p 127.0.0.1:445:445 \
            -e "ACCOUNT_tinysync=integration-secret" \
            -e "SAMBA_VOLUME_CONFIG_it=[it]; path = /shares/it; valid users = tinysync; read only = no" \
            -v /tmp/tinysync-smb-it:/shares/it \
            "$image"

      # smbd-only variant 没有 healthcheck 端点：轮询 445 端口就绪。
      - name: Wait for Samba listening on 445
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/445) 2>/dev/null; then
              echo "samba is listening on 445"
              # smbd 端口已开但初始化可能仍在进行，再给一次探测间隔。
              sleep 2
              exit 0
            fi
            sleep 2
          done
          docker logs samba
          exit 1

      - name: Run SMB integration tests
        env:
          TINYSYNC_IT_SMB_HOST: 127.0.0.1
          TINYSYNC_IT_SMB_PORT: "445"
          TINYSYNC_IT_SMB_SHARE: it
          TINYSYNC_IT_SMB_USERNAME: tinysync
          TINYSYNC_IT_SMB_PASSWORD: integration-secret
          TINYSYNC_IT_SMB_DOMAIN: WORKGROUP
        run: make integration-smb

      - name: Stop Samba service
        if: always()
        run: docker rm -f samba

  # HTTP 文件源集成：三个真实 Web Server（nginx JSON autoindex、
  # Caddy file_server browse、miniserve raw listing）分别验证同一
  # adapter 的 listing 兼容性与 Copy/Mirror 协议矩阵（http_real
  # fixture）。miniserve 启用 basic auth（真实 401 路径）；Caddy 以
  # 小 file_limit 单独复跑 fail-closed 场景（截断 listing 不授权
  # Mirror 删除）。任一步骤失败即终止（后续服务器不再执行），日志
  # 直接指向出问题的服务器。
  http:
    name: HTTP file-server integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # --- nginx：autoindex_format json（推荐形态），auto 探测。
      # 显式 root：新版官方镜像 http 级默认 root 是 /etc/nginx/html。
      - name: Run HTTP integration (nginx JSON autoindex)
        env:
          TINYSYNC_IT_HTTP_BASE_URL: http://127.0.0.1:18081/
          TINYSYNC_IT_HTTP_ROOT: /tmp/tinysync-http-nginx
          TINYSYNC_IT_HTTP_LISTING: auto
        run: |
          install -d -m 0777 /tmp/tinysync-http-nginx
          printf 'server {\n  listen 80;\n  root /usr/share/nginx/html;\n  location / {\n    autoindex on;\n    autoindex_format json;\n  }\n}\n' > /tmp/tinysync-http-nginx.conf
          docker run -d --name http-nginx \
            -p 127.0.0.1:18081:80 \
            -v /tmp/tinysync-http-nginx:/usr/share/nginx/html:ro \
            -v /tmp/tinysync-http-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:stable
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/18081) 2>/dev/null; then break; fi
            sleep 2
          done
          make integration-http
          docker rm -f http-nginx

      # --- Caddy：file_server browse + 小 file_limit（fail-closed 场景）。
      # file_limit 是 browse 子指令自身的块参数。
      - name: Run HTTP integration (Caddy browse)
        env:
          TINYSYNC_IT_HTTP_BASE_URL: http://127.0.0.1:18082/
          TINYSYNC_IT_HTTP_ROOT: /tmp/tinysync-http-caddy
          TINYSYNC_IT_HTTP_LISTING: auto
          TINYSYNC_IT_HTTP_FILE_LIMIT: "5"
        run: |
          install -d -m 0777 /tmp/tinysync-http-caddy
          printf ':80 {\n  root * /srv\n  file_server {\n    browse {\n      file_limit 5\n    }\n  }\n}\n' > /tmp/Caddyfile
          docker run -d --name http-caddy \
            -p 127.0.0.1:18082:80 \
            -v /tmp/tinysync-http-caddy:/srv \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy:2
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/18082) 2>/dev/null; then break; fi
            sleep 2
          done
          # file_limit=5：Copy/Mirror 矩阵（种子文件数 < 5 时正常）+
          # 达上限 fail-closed 场景（file-limit 测试自建恰好 5 条目）。
          make integration-http
          docker rm -f http-caddy

      # --- miniserve：--no-symlinks + basic auth（真实 401 路径）。
      - name: Run HTTP integration (miniserve)
        env:
          TINYSYNC_IT_HTTP_BASE_URL: http://127.0.0.1:18083/
          TINYSYNC_IT_HTTP_ROOT: /tmp/tinysync-http-miniserve
          TINYSYNC_IT_HTTP_LISTING: auto
          TINYSYNC_IT_HTTP_USERNAME: tinysync
          TINYSYNC_IT_HTTP_PASSWORD: integration-secret
        run: |
          install -d -m 0777 /tmp/tinysync-http-miniserve
          docker run -d --name http-miniserve \
            -p 127.0.0.1:18083:8080 \
            -v /tmp/tinysync-http-miniserve:/srv \
            svenstaro/miniserve:latest \
            --no-symlinks --auth tinysync:integration-secret /srv
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/18083) 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 2
          make integration-http
          docker rm -f http-miniserve
