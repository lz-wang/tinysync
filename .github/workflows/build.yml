name: Build and Notify

# Build = 验证"当前代码是否健康"。tag 属于 release.yml，这里没有 tag trigger，
# 也不生成 GitHub Release。不使用 Actions Artifact：PR 只验证六平台可构建，
# main/manual 额外经 Makefile 打包开发快照并镜像到 WebDAV
# （HomeLab 内网获取开发版）。
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 双保险：顶层禁用 CGO，与 Makefile $(GOENV) 的全工程约束一致。
env:
  CGO_ENABLED: "0"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      # Makefile 是版本解析唯一实现，不在 workflow 里复制一套算法。
      - name: Resolve version
        id: version
        run: echo "version=$(make version)" >> "$GITHUB_OUTPUT"

  test:
    name: Test and coverage
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Run checks and tests
        run: make ci

      - name: Generate coverage
        run: make coverage

      # 测试失败应阻断 CI；Codecov SaaS 临时不可用不应阻断构建。
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/backend.out
          flags: backend
          name: backend
          fail_ci_if_error: false

  # 协议 integration gate：真实 S3 服务（MinIO 容器）+ 真实 SSH/SFTP
  # 协议栈，验证 adapter 与同一 Sync Engine 的真实端到端行为。
  # in-process SFTP server 与 env 门控测试在无服务环境自动跳过，
  # 不影响常规 make check。
  integration:
    name: Protocol integration (MinIO + SFTP)
    needs: prepare
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: tinysync
          MINIO_ROOT_PASSWORD: tinysync-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Run protocol integration tests
        env:
          TINYSYNC_IT_S3_ENDPOINT: http://localhost:9000
          TINYSYNC_IT_S3_REGION: us-east-1
          TINYSYNC_IT_S3_ACCESS_KEY: tinysync
          TINYSYNC_IT_S3_SECRET_KEY: tinysync-secret
        run: make integration

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Install WebUI dependencies
        run: make web-ci-install

      # PR 的职责只是验证"能不能构建"：不打包、不上传。
      - name: Build binary
        if: github.event_name == 'pull_request'
        run: make build-os OS=${{ matrix.goos }} ARCH=${{ matrix.goarch }} VERSION=${{ needs.prepare.outputs.version }}

      # main/manual 打包开发快照：统一走 Makefile package-os，
      # workflow 内不再维护 mkdir/cp/tar/zip/sha256 一套打包实现。
      - name: Package development archive
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: make package-os OS=${{ matrix.goos }} ARCH=${{ matrix.goarch }} VERSION=${{ needs.prepare.outputs.version }}

      # 参考 m2h：构建产物按版本目录镜像到 WebDAV（HomeLab 内网获取开发版），
      # 附内容仅含文件名的 .sha256；镜像失败不阻断 CI。不使用 Actions
      # Artifact，消除 storage quota 对 Build CI 的影响。
      - name: Upload archive and checksum to WebDAV
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        # pin 到 v1 分支当前 commit，避免 floating tag 行为漂移。
        uses: bxb100/action-upload-webdav@d19f1edf785abf4b0b7f818ba46b6dba9b0334c6 # v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ needs.prepare.outputs.version }}"
          files: |
            dist/tinysync_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
            dist/tinysync_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}.sha256

  smoke:
    name: Smoke ${{ matrix.os }}
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # 原生编译 + 原生执行：真正验证该平台可执行文件能启动并工作，
      # 比"linux 上交叉编译出 exe"更有价值。
      - name: Build native binary
        shell: bash
        run: |
          npm ci --prefix web
          npm run build --prefix web
          binary="tinysync"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="tinysync.exe"; fi
          CGO_ENABLED=0 go build -tags webui -trimpath -buildvcs=false \
            -ldflags "-X tinysync/internal/buildinfo.Version=${{ needs.prepare.outputs.version }}" \
            -o "${binary}" .

      - name: Run native command smoke tests
        timeout-minutes: 2
        shell: bash
        run: |
          binary="./tinysync"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="./tinysync.exe"; fi
          bash scripts/smoke.sh "${binary}" '${{ needs.prepare.outputs.version }}'

  notify:
    name: Pushover notification
    needs: [prepare, test, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify via Pushover
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CODECOV_REPORT_URL: ${{ format('https://app.codecov.io/gh/{0}/commit/{1}', github.repository, github.sha) }}
        run: |
          if [[ -z "${PUSHOVER_TOKEN}" || -z "${PUSHOVER_USER}" ]]; then
            echo "Pushover secrets are not configured; skipping notification."
            exit 0
          fi

          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          SMOKE_RESULT="${{ needs.smoke.result }}"
          if [[ "${TEST_RESULT}" == "success" && "${BUILD_RESULT}" == "success" && "${SMOKE_RESULT}" == "success" ]]; then
            PRIORITY="0"
            TITLE="TinySync 构建成功"
          else
            PRIORITY="1"
            TITLE="TinySync 构建失败"
          fi

          MESSAGE=$(cat <<EOF
          <b>TinySync 构建通知</b>
          <u>测试结果</u>: ${TEST_RESULT}
          <u>构建结果</u>: ${BUILD_RESULT}
          <u>三平台 Smoke</u>: ${SMOKE_RESULT}
          <u>版本</u>: <font color="#0000ff">${{ needs.prepare.outputs.version }}</font>
          <u>分支</u>: <i>${{ github.ref_name }}</i>
          <u>触发人</u>: <i>${{ github.actor }}</i>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行详情</a>
          <a href="${CODECOV_REPORT_URL}">查看 Codecov 测试覆盖率报告</a>
          <u>提交内容</u>:
          ${HEAD_COMMIT_MESSAGE:-workflow_dispatch}
          EOF
          )

          curl -fsS https://api.pushover.net/1/messages.json \
            --data-urlencode "token=${PUSHOVER_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER}" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "priority=${PRIORITY}" \
            --data-urlencode "html=1" \
            --data-urlencode "message=${MESSAGE}"
