name: Release and Notify

# Release = 发布"一个已经明确版本号的不可变 Git tag"。
# 只由 tag push 或手动指定已有 tag 触发；普通 main push 永远不会走到这里。
# 不使用 Actions Artifact：publish 在单一 Ubuntu runner 上一次性
# cross-build 六平台（CGO_ENABLED=0），生成发行档后直接发布，
# 既不跨 job 传输文件，也不把 WebDAV 当 job 间中转站。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# 双保险：顶层禁用 CGO，与 Makefile $(GOENV) 的全工程约束一致。
env:
  CGO_ENABLED: "0"

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag and version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          # 第一阶段只接受稳定版本 vX.Y.Z；预发布需要时再扩展。
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: release tag must match vX.Y.Z: ${tag}"
            exit 2
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # 验证 1：Makefile 版本必须与 tag 一致，防止 checkout 的并不是
      # tag commit 或版本逻辑出错。
      - name: Validate Makefile version matches tag
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          actual="$(make version)"
          expected="${TAG#v}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Error: make version = ${actual}, expected ${expected} (tag commit mismatch?)"
            exit 2
          fi

      # 验证 2：CHANGELOG 必须存在对应版本段，失败立即阻断，
      # 而不是进入 publish 后才发现。release notes 由 publish 在
      # tag checkout 上直接提取，不经 Artifact 传递。
      - name: Validate CHANGELOG section
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="$(bash scripts/release-notes.sh "${VERSION}")"
          if [[ -z "${notes//[$' \t\r\n']/}" ]]; then
            echo "Error: CHANGELOG.md section [${VERSION}] is empty"
            exit 2
          fi

      # Homebrew 发布是该 workflow 的一部分：凭证缺失应在 prepare 阶段
      # 失败，而不是等 publish 全部完成后 homebrew 才发现无法推送 tap。
      - name: Validate Homebrew publishing credential
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Error: HOMEBREW_TAP_TOKEN is required to publish Formula/tinysync.rb."
            exit 2
          fi

  test:
    name: Release checks
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # Release 只做发布验证，不上传 Codecov：覆盖率属于持续集成
      # 状态（build.yml），同一 commit 不因 tag 重复生成覆盖率报告。
      - name: Run release checks
        run: make ci

  # S3 integration gate 是发布门禁的一部分：main 集成变红时不可能
  # 发布。实现与 Build workflow 共用（integration.yml），避免维护两份
  # MinIO 装配；ref 固定为发布 tag——手动补跑时调用方事件 ref 可能是
  # main，必须保证被验证的 commit 就是被发布的 commit。
  integration:
    name: S3 integration (MinIO)
    needs: prepare
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  # Hardening gate 是发布门禁的一部分：可靠性 / 规模 / restore / fuzz
  # 与 Build workflow 共用同一套证据（hardening.yml 可复用 workflow）；
  # ref 固定为发布 tag，与 integration 相同的 ref 语义。
  hardening:
    name: Hardening gate
    needs: prepare
    uses: ./.github/workflows/hardening.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  smoke:
    name: Smoke ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # 六平台 cross-build 验证"能编译"，三平台原生 Smoke 验证
      # "三类 OS 上真实可执行"：两个不同验证维度。Release 阶段重新
      # 执行，覆盖发布版本注入（例如 release ldflags 路径错误普通
      # 构建发现不了）。
      - name: Build native binary
        shell: bash
        run: |
          npm ci --prefix web
          npm run build --prefix web
          binary="tinysync"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="tinysync.exe"; fi
          CGO_ENABLED=0 go build -tags webui -trimpath -buildvcs=false \
            -ldflags "-X tinysync/internal/buildinfo.Version=${{ needs.prepare.outputs.version }}" \
            -o "${binary}" .

      - name: Run native command smoke tests
        timeout-minutes: 2
        shell: bash
        run: |
          binary="./tinysync"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="./tinysync.exe"; fi
          bash scripts/smoke.sh "${binary}" '${{ needs.prepare.outputs.version }}'

  publish:
    name: Publish GitHub Release and WebDAV mirror
    needs: [prepare, test, integration, hardening, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      # CGO_ENABLED=0 允许在单一 Ubuntu runner 一次性 cross-build
      # 六平台并生成发行档 + checksums.txt（Makefile 是打包唯一实现）。
      - name: Install WebUI dependencies
        run: make web-ci-install

      - name: Build and package six platforms
        run: make dist VERSION=${{ needs.prepare.outputs.version }}

      # publish 已 checkout 当前 tag，直接从 CHANGELOG 提取发布说明。
      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-notes.sh "${VERSION}" > release-notes.md

      # 幂等发布：Release 已存在时 upload --clobber + 覆盖 notes，
      # 否则创建；支持 workflow_dispatch 重跑补救失败的发布。
      # GitHub Release 含 6 archives + 逐文件 .sha256（Homebrew tap
      # 与下游校验直接引用）+ checksums.txt（整目录一次性校验）。
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          assets=(dist/*.tar.gz dist/*.zip dist/*.sha256 dist/checksums.txt)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" "${assets[@]}" \
              --verify-tag \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

      # WebDAV 只在 GitHub Release 成功后镜像完整正式版本，避免
      # build 中途失败留下"半发行版本"目录；镜像失败不阻断发布
      # （GitHub Release 始终是权威分发渠道）。
      - name: Mirror release to WebDAV
        continue-on-error: true
        # pin 到 v1 分支当前 commit，避免 floating tag 行为漂移。
        uses: bxb100/action-upload-webdav@d19f1edf785abf4b0b7f818ba46b6dba9b0334c6 # v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ needs.prepare.outputs.version }}"
          files: |
            dist/tinysync_${{ needs.prepare.outputs.version }}_linux_amd64.tar.gz
            dist/tinysync_${{ needs.prepare.outputs.version }}_linux_amd64.tar.gz.sha256
            dist/tinysync_${{ needs.prepare.outputs.version }}_linux_arm64.tar.gz
            dist/tinysync_${{ needs.prepare.outputs.version }}_linux_arm64.tar.gz.sha256
            dist/tinysync_${{ needs.prepare.outputs.version }}_darwin_amd64.tar.gz
            dist/tinysync_${{ needs.prepare.outputs.version }}_darwin_amd64.tar.gz.sha256
            dist/tinysync_${{ needs.prepare.outputs.version }}_darwin_arm64.tar.gz
            dist/tinysync_${{ needs.prepare.outputs.version }}_darwin_arm64.tar.gz.sha256
            dist/tinysync_${{ needs.prepare.outputs.version }}_windows_amd64.zip
            dist/tinysync_${{ needs.prepare.outputs.version }}_windows_amd64.zip.sha256
            dist/tinysync_${{ needs.prepare.outputs.version }}_windows_arm64.zip
            dist/tinysync_${{ needs.prepare.outputs.version }}_windows_arm64.zip.sha256
            dist/checksums.txt

  # Homebrew tap 发布：Formula 的 sha256 直接读 GitHub Release 上的
  # 逐文件 .sha256，因此必须排在 publish 之后。仅在当前 tag 仍是仓库
  # latest release 时推送，防止旧 tag 补跑把 tap 回滚到旧版本；本地
  # tap 路径先 audit / install / test，全部通过才 push。
  homebrew:
    name: Publish Homebrew Formula
    needs: [prepare, publish]
    runs-on: macos-latest
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Check latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest}" != "${TAG}" ]]; then
            echo "Skip stale release: ${TAG}; latest is ${latest}."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew tap
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          repository: lz-wang/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # darwin / linux 四个安装目标进 Formula；windows 发行档不进
      # Homebrew（brew 不分发 Windows 包）。
      - name: Read release checksums
        if: steps.release.outputs.publish == 'true'
        id: sha
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          base="https://github.com/lz-wang/tinysync/releases/download/${TAG}"
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            file="tinysync_${VERSION}_${target}.tar.gz.sha256"
            sha="$(curl -fsSL "${base}/${file}" | awk 'NR == 1 { print $1 }')"

            if [[ ! "${sha}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: invalid SHA-256 for ${file}."
              exit 2
            fi

            echo "${target}=${sha}" >> "${GITHUB_OUTPUT}"
          done

      - name: Generate Formula
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DARWIN_AMD64_SHA: ${{ steps.sha.outputs.darwin_amd64 }}
          DARWIN_ARM64_SHA: ${{ steps.sha.outputs.darwin_arm64 }}
          LINUX_AMD64_SHA: ${{ steps.sha.outputs.linux_amd64 }}
          LINUX_ARM64_SHA: ${{ steps.sha.outputs.linux_arm64 }}
        shell: bash
        run: |
          set -euo pipefail

          cat > homebrew-tap/Formula/tinysync.rb <<RUBY
          class Tinysync < Formula
            desc "File sync server for HomeLab with WebDAV, S3 and SFTP sources"
            homepage "https://github.com/lz-wang/tinysync"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/lz-wang/tinysync/releases/download/v${VERSION}/tinysync_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/tinysync/releases/download/v${VERSION}/tinysync_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/lz-wang/tinysync/releases/download/v${VERSION}/tinysync_${VERSION}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/tinysync/releases/download/v${VERSION}/tinysync_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "tinysync"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tinysync --version")
            end
          end
          RUBY

      - name: Commit Formula locally
        if: steps.release.outputs.publish == 'true'
        id: formula
        shell: bash
        run: |
          set -euo pipefail

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git -C homebrew-tap status --porcelain -- Formula/tinysync.rb)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -C homebrew-tap add Formula/tinysync.rb
          git -C homebrew-tap commit -m "tinysync ${{ needs.prepare.outputs.version }}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Test Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          brew tap lz-wang/tap "file://${GITHUB_WORKSPACE}/homebrew-tap"
          brew audit --strict --formula lz-wang/tap/tinysync
          brew install --formula lz-wang/tap/tinysync
          brew test lz-wang/tap/tinysync

      - name: Publish Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap push origin HEAD:main

  notify:
    name: Pushover notification
    needs: [prepare, test, integration, hardening, smoke, publish, homebrew]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify via Pushover
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          if [[ -z "${PUSHOVER_TOKEN}" || -z "${PUSHOVER_USER}" ]]; then
            echo "Pushover secrets are not configured; skipping notification."
            exit 0
          fi

          TEST_RESULT="${{ needs.test.result }}"
          INTEGRATION_RESULT="${{ needs.integration.result }}"
          HARDENING_RESULT="${{ needs.hardening.result }}"
          SMOKE_RESULT="${{ needs.smoke.result }}"
          PUBLISH_RESULT="${{ needs.publish.result }}"
          HOMEBREW_RESULT="${{ needs.homebrew.result }}"
          if [[ "${TEST_RESULT}" == "success" && "${INTEGRATION_RESULT}" == "success" && "${HARDENING_RESULT}" == "success" && "${SMOKE_RESULT}" == "success" && "${PUBLISH_RESULT}" == "success" && "${HOMEBREW_RESULT}" == "success" ]]; then
            PRIORITY="0"
            TITLE="TinySync 发布成功"
          else
            PRIORITY="1"
            TITLE="TinySync 发布失败"
          fi

          MESSAGE=$(cat <<EOF
          <b>TinySync 发布通知</b>
          <u>测试结果</u>: ${TEST_RESULT}
          <u>协议集成</u>: ${INTEGRATION_RESULT}
          <u>Hardening</u>: ${HARDENING_RESULT}
          <u>三平台 Smoke</u>: ${SMOKE_RESULT}
          <u>GitHub Release</u>: ${PUBLISH_RESULT}
          <u>Homebrew</u>: ${HOMEBREW_RESULT}
          <u>版本</u>: <font color="#0000ff">${RELEASE_TAG}</font>
          <u>触发人</u>: <i>${{ github.actor }}</i>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行详情</a>
          <a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}">查看 GitHub Release</a>
          EOF
          )

          curl -fsS https://api.pushover.net/1/messages.json \
            --data-urlencode "token=${PUSHOVER_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER}" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "priority=${PRIORITY}" \
            --data-urlencode "html=1" \
            --data-urlencode "message=${MESSAGE}"
